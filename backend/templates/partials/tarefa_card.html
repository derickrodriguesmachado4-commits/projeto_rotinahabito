{% macro tarefa_card(tarefa,form=False,status=True) %}
    <div 
    {% if tarefa.data['status'] %}
        style="width: 30%; background-color: rgb(212, 212, 212); display: flex; align-items: center; gap: 20px;"
    {% else %}
        style="width: 30%; background-color: gray; display: flex; align-items: center; gap: 20px;"
    {% endif %}>
        <p>{{tarefa.data["titulo"]}}</p>
        <p>{{tarefa.data["conteudo"]}}</p>
        {% if form %}
        <form action="/tarefa/trocar_status" method="POST">
            <input type="hidden" name="codigo" value="{{ tarefa.data['codigo'] }}" />
            <input type="hidden" name="data" value="{{ tarefa.data['datetime'] }}" />
            <button type="submit">{% if tarefa.data["status"] %} F {% else %} P {% endif %}</button>
        </form>
        {% endif %}
    </div>

{% endmacro %}
